# [공통 설정]
# - 모든 환경(dev/prod)에서 공통으로 사용하는 기본값을 둡니다.
# - 환경별로 달라지는 값은 application-<profile>.yml에서 오버라이드합니다.
# - 민감정보는 환경변수로 주입하는 것을 기본 원칙으로 합니다.
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: backend
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/transport_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME:transport}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  javascript-appkey: ${KAKAO_JAVASCRIPT_APPKEY:}
  mobility-base-url: ${KAKAO_MOBILITY_BASE_URL:https://apis-navi.kakaomobility.com}

route:
  assembly:
    top-n-real-distance: ${ROUTE_ASSEMBLY_TOP_N_REAL_DISTANCE:10}
  traffic:
    live-enabled: ${ROUTE_TRAFFIC_LIVE_ENABLED:false}
    live-cache-ttl-seconds: ${ROUTE_TRAFFIC_LIVE_CACHE_TTL_SECONDS:180}
    snapshot-cache-ttl-hours: ${ROUTE_TRAFFIC_SNAPSHOT_CACHE_TTL_HOURS:24}
    live-bucket-seconds: ${ROUTE_TRAFFIC_LIVE_BUCKET_SECONDS:300}
    single-flight-enabled: ${ROUTE_TRAFFIC_SINGLE_FLIGHT_ENABLED:true}
    single-flight-wait-ms: ${ROUTE_TRAFFIC_SINGLE_FLIGHT_WAIT_MS:4000}

toss:
  payments:
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY}
    client-key: ${TOSS_PAYMENTS_CLIENT_KEY}
    test-mode: ${TOSS_PAYMENTS_TEST_MODE:true}

odcloud:
  api:
    base-url: ${ODCLOUD_API_BASE_URL:https://api.odcloud.kr}
    key: ${ODCLOUD_API_KEY}

deepseek:
  enabled: ${DEEPSEEK_ENABLED:false}
  api:
    key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat

fcm:
  enabled: ${FCM_ENABLED:false}
  service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:classpath:firebase/service-account.json}

delivery-photo:
  storage-dir: ${DELIVERY_PHOTO_STORAGE_DIR:uploads/delivery-photos}

springdoc:
  api-docs:
    path: /api-docs
operations:
  swagger-ui:
    path: /swagger-ui
  scheduler:
    enabled: ${OPERATIONS_SCHEDULER_ENABLED:true}
  match:
    payment-timeout-minutes: ${MATCH_PAYMENT_TIMEOUT_MINUTES:60}
    payment-timeout-check-ms: ${MATCH_PAYMENT_TIMEOUT_CHECK_MS:60000}
  settlement:
    auto-confirm-hours: ${SETTLEMENT_AUTO_CONFIRM_HOURS:24}
    auto-confirm-check-ms: ${SETTLEMENT_AUTO_CONFIRM_CHECK_MS:300000}

algorithm:
  gateway:
    default-max-pickup-distance-km: ${ALGORITHM_MAX_PICKUP_KM:25.0}
    max-candidate-quotes: ${ALGORITHM_MAX_CANDIDATES:80}

geocoding:
  kakao:
    base-url: ${GEOCODING_KAKAO_BASE_URL:https://dapi.kakao.com}
    api-key: ${KAKAO_REST_API_KEY:}
  timeout-ms: ${GEOCODING_TIMEOUT_MS:2000}
  cache:
    ttl-seconds: ${GEOCODING_CACHE_TTL_SECONDS:86400}

routing:
  kakao:
    base-url: ${ROUTING_KAKAO_BASE_URL:https://apis-navi.kakaomobility.com}
    api-key: ${KAKAO_REST_API_KEY:}
  timeout-ms: ${ROUTING_TIMEOUT_MS:3000}
