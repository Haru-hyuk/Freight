# [운영(prod) 전용 설정]
# - 운영 환경에서 필요한 보안/성능 설정을 정의합니다.
# - 민감정보(JWT/외부 API 키)는 반드시 환경변수로 주입합니다.
# - 공통값(application.yml)을 운영 환경 기준으로 오버라이드합니다.

spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  h2:
    console:
      enabled: false

# JWT secret는 JWT_SECRET 환경변수로 주입
# 최소 32자 이상 강한 난수 사용 권장

# CORS - 운영 도메인만 명시
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  allow-wildcard: false

app:
  rate-limit:
    redis-enabled: ${APP_RATE_LIMIT_REDIS_ENABLED:true}

admin:
  integration:
    dispatch-snapshot-limit: ${ADMIN_INTEGRATION_DISPATCH_SNAPSHOT_LIMIT:500}

# 운영에서는 Swagger 비활성화
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.freight: INFO
    org.hibernate: WARN

# 모니터링용 Actuator 엔드포인트
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
